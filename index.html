<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibration Live Graph</title>

  <!-- Firebase + Chart.js -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

  <style>
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 20px;
    }
    canvas {
      background: #1e293b;
      border-radius: 12px;
      max-width: 800px;
      margin-top: 20px;
    }
    #alertBox {
      display: none;
      background: #ef4444;
      color: white;
      padding: 10px;
      margin: 10px auto;
      border-radius: 8px;
      width: fit-content;
    }
  </style>
</head>

<body>
  <h2>📈 Vibration Live Graph (Last 30 Minutes)</h2>

  <!-- Graph Box -->
  <div id="graphBox">
    <div id="alertBox">⚠️ Vibration Detected!</div>
    <canvas id="vibrationChart" width="800" height="400"></canvas>
  </div>

<script>
  // --- Firebase Config ---
  const firebaseConfig = {
    apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
    databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);

  const db = firebase.database();

  const alertBox = document.getElementById("alertBox");

  let vibrationChart = null; // will hold chart instance

  // --- Start Real-Time Chart Function ---
  function startRealtimeChart() {
    // Destroy previous chart instance if exists
    if (vibrationChart) {
      vibrationChart.destroy();
      console.log("Destroyed old chart instance");
    }

    // Chart.js setup
    const ctx = document.getElementById('vibrationChart').getContext('2d');
    const chartData = {
      labels: [],
      datasets: [{
        label: 'Frequency (Hz)',
        data: [],
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56,189,248,0.2)',
        borderWidth: 2,
        pointRadius: 3,
        tension: 0.3
      }]
    };

    const chartOptions = {
      animation: false,
      scales: {
        x: { 
          type: 'time',
          time: { unit: 'minute', tooltipFormat: 'HH:mm:ss' },
          ticks: { color: '#cbd5e1' }
        },
        y: { 
          min: -100, max: 600,  // Adjust the range for frequency from -100 to 600
          ticks: { stepSize: 100, color: '#cbd5e1' }
        }
      },
      plugins: {
        legend: { labels: { color: '#f1f5f9' } }
      }
    };

    // Create chart safely
    vibrationChart = new Chart(ctx, { type: 'line', data: chartData, options: chartOptions });

    const WINDOW_MS = 30 * 60 * 1000; // 30 minutes in milliseconds

    // Function to update chart with new data
    const updateChart = (freqValue) => {
      const now = new Date();  // Get local system time
      chartData.labels.push(now);
      chartData.datasets[0].data.push(freqValue);

      // Keep last 30 minutes of data
      while (chartData.labels.length && (now - chartData.labels[0]) > WINDOW_MS) {
        chartData.labels.shift();
        chartData.datasets[0].data.shift();
      }

      // Update chart with frequency value
      vibrationChart.update();
    };

    // Firebase listener to update chart in real-time
    const ref = db.ref("live/fft_frequency_hz");  // Firebase path for frequency data
    ref.off(); // prevent multiple subscriptions
    ref.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data && typeof data === 'number') {
        console.log("Firebase update:", data);
        updateChart(data);  // Update the chart with the frequency value from Firebase
      }
    });
  }

  // Start the chart once the page loads
  window.onload = startRealtimeChart;
</script>
</body>
</html>
