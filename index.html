<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlantOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body{margin:0;font-family:Inter,sans-serif;background:#eef2f7}

/* LOGIN */
#login{
  display:flex;align-items:center;justify-content:center;
  height:100vh;
}
.login-card{
  width:420px;background:#fff;padding:32px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.12)
}
input,button{
  width:100%;padding:10px;margin-top:14px;
  border-radius:6px;border:1px solid #cbd5e1
}
button{
  background:#0b3c8c;color:#fff;
  font-weight:600;border:none;cursor:pointer
}
.error{color:#dc2626;margin-top:10px}

/* DASHBOARD */
#app{display:none}
.topbar{
  height:60px;background:#0b3c8c;color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-weight:600
}
.main{padding:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.kpi{
  background:#fff;padding:18px;border-radius:8px;
  box-shadow:0 3px 10px rgba(0,0,0,.08)
}
.card{
  background:#fff;padding:18px;border-radius:8px;
  margin-top:22px;box-shadow:0 3px 10px rgba(0,0,0,.08)
}
.lamps{display:flex;gap:18px;margin:10px 0}
.lamp{width:18px;height:18px;border-radius:50%;background:#cbd5e1}
.green{background:#22c55e}
.yellow{background:#facc15}
.red{background:#dc2626}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <h2>Welcome to PlantOS</h2>
    <p>Manufacturing Intelligence Platform</p>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <div id="err" class="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app">
  <div class="topbar">
    PlantOS – Digital Reporting
    <div>
      <span id="userEmail"></span>
      &nbsp;|&nbsp;
      <a href="#" onclick="logout()" style="color:#fff">Logout</a>
    </div>
  </div>

  <div class="main">

    <div class="kpis">
      <div class="kpi"><h4>MTBF</h4><h2 id="mtbf">–</h2></div>
      <div class="kpi"><h4>MTTR</h4><h2 id="mttr">–</h2></div>
      <div class="kpi"><h4>Plants</h4><h2>1</h2></div>
      <div class="kpi"><h4>Equipment</h4><h2>1</h2></div>
    </div>

    <div class="card">
      <h3>Conveyor Status</h3>
      <div class="lamps">
        RUN <div id="run" class="lamp"></div>
        WARN <div id="warn" class="lamp"></div>
        TRIP <div id="trip" class="lamp"></div>
      </div>
      <h2><span id="vel">0.00</span> mm/s</h2>
    </div>

    <div class="card">
      <h3>Vibration Trend</h3>
      <canvas id="trend" height="90"></canvas>
    </div>

  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
      apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
      databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });

const auth=firebase.auth();
const db=firebase.database();

/* ---------- AUTH ---------- */
auth.onAuthStateChanged(user=>{
  if(user){
    login.style.display="none";
    app.style.display="block";
    userEmail.textContent=user.email;
  }else{
    app.style.display="none";
    login.style.display="flex";
  }
});

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
    .catch(e=>err.textContent=e.message);
}
function logout(){ auth.signOut(); }

/* ---------- CHART ---------- */
const data={labels:[],datasets:[{data:[],borderColor:"#22c55e"}]};
const chart=new Chart(trend,{
  type:"line",
  data,
  options:{animation:false,scales:{x:{type:"time"},y:{min:0,max:400}}}
});

/* ---------- STATUS ---------- */
const WARN=90,TRIP=100;
function update(v){
  vel.textContent=v.toFixed(2);
  data.labels.push(new Date());
  data.datasets[0].data.push(v);
  if(data.labels.length>200){data.labels.shift();data.datasets[0].data.shift();}
  chart.update();

  run.className=warn.className=trip.className="lamp";
  if(v<WARN) run.classList.add("green");
  else if(v<TRIP) warn.classList.add("yellow");
  else trip.classList.add("red");
}

db.ref("vibration/velocity_rms").on("value",s=>{
  if(typeof s.val()==="number") update(s.val());
});

/* ---------- MTBF / MTTR (ISO) ---------- */
let lastRun=null,lastTrip=null;
let uptime=0,downtime=0,failures=0;

db.ref("events").on("child_added",snap=>{
  const e=snap.val();

  if(e.type==="RUN") lastRun=e.time;

  if(e.type==="TRIP" && lastRun){
    failures++;
    uptime += e.time-lastRun;
    lastTrip=e.time;
  }

  if(e.type==="REPAIR" && lastTrip){
    downtime += e.time-lastTrip;
  }

  if(failures>0){
    mtbf.textContent=(uptime/3600000/failures).toFixed(1)+" hrs";
    mttr.textContent=(downtime/3600000/failures).toFixed(1)+" hrs";
  }
});
</script>

</body>
</html>
