<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real-time FFT Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }
    canvas {
      max-width: 800px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Real-time FFT Frequency</h2>
  <canvas id="fftChart"></canvas>

  <script>
    // ---------------- Firebase Configuration ----------------
    const firebaseConfig = {
  apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
  authDomain: "vibrationstatus.firebaseapp.com",
  databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vibrationstatus",
  storageBucket: "vibrationstatus.firebasestorage.app",
  messagingSenderId: "1001204540193",
  appId: "1:1001204540193:web:79495c246902bee191d460",
  measurementId: "G-RYDGS81ZHW"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ---------------- Chart.js Setup ----------------
    const ctx = document.getElementById('fftChart').getContext('2d');
    const fftChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [], // timestamps
        datasets: [{
          label: 'FFT Frequency (Hz)',
          data: [],
          borderColor: 'rgba(75, 192, 192, 1)',
          backgroundColor: 'rgba(75, 192, 192, 0.2)',
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'time',
            time: {
              parser: 'HH:mm:ss',
              tooltipFormat: 'HH:mm:ss',
              unit: 'second',
              displayFormats: {
                second: 'HH:mm:ss'
              }
            },
            title: {
              display: true,
              text: 'Time'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Frequency (Hz)'
            }
          }
        }
      }
    });

    // ---------------- Firebase Real-time Listener ----------------
    const fftRef = db.ref('live/fft_frequency_hz');

    fftRef.on('value', (snapshot) => {
      const frequency = snapshot.val();
      const now = new Date();
      const timeLabel = now.toLocaleTimeString();

      // Add new data
      fftChart.data.labels.push(timeLabel);
      fftChart.data.datasets[0].data.push(frequency);

      // Keep only last 50 points
      if (fftChart.data.labels.length > 50) {
        fftChart.data.labels.shift();
        fftChart.data.datasets[0].data.shift();
      }

      fftChart.update();
    });
  </script>
</body>
</html>
