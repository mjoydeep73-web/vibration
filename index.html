 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Infinite Uptime – Conveyor Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#0f172a;color:#e5e7eb}
.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:230px;
 background:#0b2239;padding:20px
}
.sidebar h2{color:#fff;margin-bottom:30px}
.sidebar a{display:block;color:#94a3b8;margin:12px 0;text-decoration:none}
.sidebar a:hover{color:#fff}

.main{margin-left:250px;padding:20px}
.cards{display:flex;gap:20px;margin-bottom:20px}
.card{
 flex:1;background:#111827;padding:20px;border-radius:8px;
 box-shadow:0 0 10px #0003;text-align:center
}
.card h3{margin:0;color:#9ca3af;font-size:14px}
.card h1{margin:8px 0 0;font-size:28px}

.process{
 background:#111827;border-radius:8px;padding:20px;
 display:flex;align-items:center;justify-content:space-between
}

.lamp{width:18px;height:18px;border-radius:50%;display:inline-block;margin-left:6px;background:#374151}
.green{background:#22c55e}.yellow{background:#facc15}.red{background:#dc2626}.white{background:#e5e7eb}

.conveyor{display:flex;align-items:center;gap:12px}
.roller{width:70px;height:70px;background:#bbb;border-radius:50%}
.belt{
 width:320px;height:45px;border-radius:22px;
 background:repeating-linear-gradient(90deg,#8b9cae,#8b9cae 10px,#a1b1c4 10px,#a1b1c4 20px);
 background-size:40px 40px
}
@keyframes beltMove{from{background-position:0}to{background-position:40px}}
@keyframes rollerSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.chartBox{background:#111827;margin-top:20px;padding:20px;border-radius:8px}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #334155;padding:6px;text-align:center}
.alarm-trip{background:#3b0a0a}
.alarm-warn{background:#3a2e0a}
.alarm-ok{background:#0a2e1a}
</style>
</head>

<body>

<div class="sidebar">
  <h2>INFINITE UPTIME</h2>
  <a>Analytics</a>
  <a>Service History</a>
  <a>Equipment Timeline</a>
</div>

<div class="main">

<h2>Conveyor Analytics</h2>

<div class="cards">
  <div class="card"><h3>Start Time</h3><h1 id="startTime">--</h1></div>
  <div class="card"><h3>Stop Time</h3><h1 id="stopTime">--</h1></div>
  <div class="card"><h3>Running Hours</h3><h1 id="runHr">0 Hr</h1></div>
  <div class="card"><h3>Last Alarm</h3><h1 id="lastAlarm">--</h1></div>
</div>

<div class="process">
  <div>
    RUN <div id="lampRun" class="lamp"></div><br><br>
    WARN <div id="lampWarn" class="lamp"></div><br><br>
    TRIP <div id="lampTrip" class="lamp"></div>
  </div>

  <div class="conveyor">
    <div id="rollerLeft" class="roller"></div>
    <div id="belt" class="belt"></div>
    <div id="rollerRight" class="roller"></div>
  </div>

  <div style="text-align:center">
    <h3>Velocity</h3>
    <h1 id="vel">0 mm/s</h1>
    <h3>RPM</h3>
    <h1 id="rpmText">0</h1>
    <h3>State</h3>
    <h1 id="stateText">IDLE</h1>
  </div>
</div>

<div class="chartBox">
  <canvas id="trend" height="100"></canvas>

  <h3>Alarm History</h3>
  <table>
    <thead><tr><th>Time</th><th>Type</th><th>Value</th><th>Message</th></tr></thead>
    <tbody id="alarmTable"></tbody>
  </table>
</div>

</div>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
 databaseURL:"https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db=firebase.database();

const WARN=90,TRIP=100;
let lastState="",startTs=null,runInterval=null;

const chart=new Chart(trend.getContext("2d"),{
 type:"line",
 data:{labels:[],datasets:[{
   label:"Velocity RMS (mm/s)",
   data:[],
   borderColor:"#22c55e",
   pointRadius:0,
   tension:0.3
 }]},
 options:{animation:false,scales:{x:{type:"time"},y:{min:0,max:400}}}
});

function logAlarm(type,v,msg){
 const ref=db.ref("alarms");
 ref.push({time:Date.now(),type,value:v,message:msg});
 lastAlarm.textContent=type+" @ "+v.toFixed(1);
}

function updateRunHours(){
 if(!startTs)return;
 runHr.textContent=((Date.now()-startTs)/3600000).toFixed(2)+" Hr";
}

function animate(v){
 let speed=Math.min(v/120,1);
 let dur=Math.max(0.25,1.2-1.2*speed);
 let rpm=Math.round(60/dur);
 rpmText.textContent=rpm;
 rollerLeft.style.animation=`rollerSpin ${dur}s linear infinite`;
 rollerRight.style.animation=`rollerSpin ${dur}s linear infinite reverse`;
 belt.style.animation=`beltMove ${dur}s linear infinite`;
}

function stopAnim(){
 rollerLeft.style.animation="none";
 rollerRight.style.animation="none";
 belt.style.animation="none";
 rpmText.textContent=0;
}

function update(v){
 vel.textContent=v.toFixed(2)+" mm/s";

 chart.data.labels.push(new Date());
 chart.data.datasets[0].data.push(v);
 if(chart.data.labels.length>300){
   chart.data.labels.shift();
   chart.data.datasets[0].data.shift();
 }
 chart.update("none");

 lampRun.className="lamp";
 lampWarn.className="lamp";
 lampTrip.className="lamp";

 if(v<=10){
  stateText.textContent="IDLE";
  lampRun.classList.add("white");
  stopAnim();
  if(lastState!=="IDLE"){
    stopTime.textContent=new Date().toLocaleTimeString();
    clearInterval(runInterval);
    logAlarm("IDLE",v,"Stopped");
    lastState="IDLE";
  }
 }
 else if(v<WARN){
  stateText.textContent="RUN";
  lampRun.classList.add("green");
  animate(v);
  if(lastState!=="RUN"){
    startTs=Date.now();
    startTime.textContent=new Date().toLocaleTimeString();
    runInterval=setInterval(updateRunHours,1000);
    logAlarm("RUN",v,"Running");
    lastState="RUN";
  }
 }
 else if(v<TRIP){
  stateText.textContent="WARN";
  lampWarn.classList.add("yellow");
  stopAnim();
  clearInterval(runInterval);
  if(lastState!=="WARN"){
    logAlarm("WARN",v,"High vibration");
    lastState="WARN";
  }
 }
 else{
  stateText.textContent="TRIP";
  lampTrip.classList.add("red");
  stopAnim();
  clearInterval(runInterval);
  stopTime.textContent=new Date().toLocaleTimeString();
  if(lastState!=="TRIP"){
    logAlarm("TRIP",v,"Auto shutdown");
    lastState="TRIP";
  }
 }
}

db.ref("vibration/velocity_rms").on("value",s=>{
 const val=s.val();
 if(typeof val==="number")update(val);
});

db.ref("alarms").limitToLast(20).on("child_added",snap=>{
 const a=snap.val();
 const tr=document.createElement("tr");
 tr.className=a.type==="TRIP"?"alarm-trip":a.type==="WARN"?"alarm-warn":"alarm-ok";
 tr.innerHTML=`<td>${new Date(a.time).toLocaleString()}</td>
 <td>${a.type}</td><td>${a.value.toFixed(2)}</td><td>${a.message}</td>`;
 alarmTable.prepend(tr);
});
</script>

</body>
</html>
