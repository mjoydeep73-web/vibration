<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocity RMS Monitor</title>

<!-- Firebase + Chart.js -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body {
  background: #0f172a;
  color: #e5e7eb;
  font-family: "Segoe UI", sans-serif;
  text-align: center;
  padding: 20px;
}

canvas {
  background: #020617;
  border-radius: 14px;
  max-width: 900px;
  margin-top: 20px;
}

#alertBox {
  display: none;
  background: #dc2626;
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: bold;
  margin: 10px auto;
}

#maxBox {
  margin: 12px auto;
  padding: 12px 22px;
  background: #020617;
  border: 2px solid #38bdf8;
  border-radius: 12px;
  width: fit-content;
  font-size: 18px;
  box-shadow: 0 0 14px rgba(56,189,248,0.4);
}

#maxValue {
  color: #fde047;
  font-size: 22px;
}

button {
  margin-top: 10px;
  padding: 8px 16px;
  background: #2563eb;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: #1d4ed8; }
</style>
</head>

<body>

<h2>📈 Vibration RMS Live Monitor </h2>

<div id="maxBox">
Max Velocity RMS: <span id="maxValue">0</span> mm/s<br>
<button onclick="resetMax()">🔁 Reset Max</button>
</div>

<div id="alertBox">🚨 ISO ZONE D — SEVERE VIBRATION</div>

<canvas id="velChart" width="900" height="420"></canvas>

<script>
/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
  databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

/* ✅ INITIALIZE FIREBASE (YOU MISSED THIS) */
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ISO 10816 Limits */
const ZONE_B = 20;
const ZONE_C = 50;
const ZONE_D = 100;

const WINDOW_MS = 30 * 60 * 1000;
let maxVel = 0;
let alertActive = false;

const alertBox = document.getElementById("alertBox");
const maxValueEl = document.getElementById("maxValue");

/* 🔊 Buzzer */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
document.body.addEventListener("click", () => audioCtx.resume(), { once: true });

function playBuzzer() {
  const osc = audioCtx.createOscillator();
  osc.frequency.value = 1200;
  osc.connect(audioCtx.destination);
  osc.start();
  setTimeout(() => osc.stop(), 300);
}

/* 📊 Chart */
const ctx = document.getElementById("velChart").getContext("2d");

const chartData = {
  labels: [],
  datasets: [{
    label: "Velocity RMS (mm/s)",
    data: [],
    borderColor: "#38bdf8",
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.3,
    fill: true,
    backgroundColor: "rgba(56,189,248,0.15)"
  }]
};

const velChart = new Chart(ctx, {
  type: "line",
  data: chartData,
  options: {
    animation: false,
    scales: {
      x: { type: "time" },
      y: {
        min: 0,
        max: 120,
        title: { display: true, text: "mm/s" }
      }
    }
  }
});

/* 🔄 Update Function */
function updateChart(val) {
  const now = new Date();
  chartData.labels.push(now);
  chartData.datasets[0].data.push(val);

  while (now - chartData.labels[0] > WINDOW_MS) {
    chartData.labels.shift();
    chartData.datasets[0].data.shift();
  }

  if (val > maxVel) {
    maxVel = val;
    maxValueEl.textContent = maxVel.toFixed(2);
  }

  if (val >= ZONE_D && !alertActive) {
    alertActive = true;
    alertBox.style.display = "block";
    chartData.datasets[0].borderColor = "#000";
    playBuzzer();
    navigator.vibrate?.([300,150,300]);
  }

  if (val < ZONE_D) {
    alertActive = false;
    alertBox.style.display = "none";
    chartData.datasets[0].borderColor = "#38bdf8";
  }

  velChart.update("none");
}

/* 🔥 Firebase Listener */
db.ref("vibration/velocity_rms").on("value", snap => {
  const v = snap.val();
  console.log("Firebase value:", v); // DEBUG
  if (typeof v === "number") updateChart(v);
});

/* 🔁 Reset */
function resetMax() {
  maxVel = 0;
  maxValueEl.textContent = "0";
}
</script>

</body>
</html>
