<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Time Analyzer - DeurTech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body{
  margin:0;
  background:#1b1f23;
  color:#e5e7eb;
  font-family:Segoe UI, Arial, sans-serif;
}

/* HEADER */
.header{
  background:#0f172a;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #334155;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  padding:12px;
}

/* PANELS */
.panel{
  background:#111827;
  border:2px solid #334155;
  border-radius:6px;
  padding:10px;
}

/* STATUS LAMPS */
.lamps{
  display:flex;
  gap:14px;
  margin:10px 0;
}
.lamp{
  width:18px;height:18px;border-radius:50%;
  background:#374151;
  box-shadow:inset 0 0 6px black;
}
.green{background:#22c55e;}
.yellow{background:#facc15;}
.red{background:#dc2626;}

/* CONVEYOR */
.mimic{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:40px;
  margin-top:20px;
}

.roller{
  width:80px;
  height:80px;
  border-radius:50%;
  border:3px solid #64748b;
  background:#020617;
  position:relative;
}

.roller::after{
  content:"";
  width:6px;height:14px;
  background:#94a3b8;
  position:absolute;
  top:8px;left:50%;
  transform:translateX(-50%);
}

.belt{
  width:160px;
  height:16px;
  border-radius:8px;
  background:#374151;
  overflow:hidden;
  position:relative;
}

.belt::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.15) 0,
    rgba(255,255,255,.15) 10px,
    transparent 10px,
    transparent 20px
  );
  animation:moveBelt .6s linear infinite;
}

.belt.idle::before{ animation-play-state:paused; }
.belt.run{ background:#22c55e; }
.belt.warn{ background:#facc15; }
.belt.trip{
  background:#7f1d1d;
}
.belt.trip::before{ animation-play-state:paused; }

.rotate{
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes moveBelt{
  from{background-position:0 0}
  to{background-position:40px 0}
}

/* VALUE */
.value{
  font-size:30px;
  text-align:center;
  margin-top:10px;
}

/* ALARM */
.alarm{
  display:none;
  background:#7f1d1d;
  border:2px solid #dc2626;
  padding:10px;
  font-weight:bold;
  margin-top:10px;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.4;}}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border:1px solid #334155;
  padding:6px;
  text-align:center;
}
.alarm-warn{background:#713f12;color:#fde68a;}
.alarm-trip{background:#7f1d1d;color:#fecaca;}
.alarm-ok{background:#064e3b;color:#a7f3d0;}

canvas{
  background:#020617;
  border-radius:6px;
}

/* LOGIN */
#loginBox{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="panel" style="width:320px;text-align:center">
    <h3>🔐 Operator Login</h3>
    <input id="email" type="email" placeholder="Email" style="width:100%;padding:8px;margin:6px 0">
    <input id="password" type="password" placeholder="Password" style="width:100%;padding:8px;margin:6px 0">
    <button onclick="login()" style="width:100%;padding:8px">Login</button>
    <div id="loginError" style="color:#f87171;margin-top:8px"></div>
  </div>
</div>

<div class="header">
  <h2>🏭 Real Time Analyzer - DeurTech</h2>
  <div>
    Operator: <b id="userEmail">---</b>
    <button onclick="logout()" style="margin-left:10px">Logout</button>
  </div>
</div>

<div class="main">

<div class="panel">
  <h3>CONVEYOR STATUS</h3>

  <div class="lamps">
    RUN <div id="lampRun" class="lamp"></div>
    WARN <div id="lampWarn" class="lamp"></div>
    TRIP <div id="lampTrip" class="lamp"></div>
  </div>

  <div class="mimic">
    <div id="r1" class="roller"></div>
    <div id="belt" class="belt idle"></div>
    <div id="r2" class="roller"></div>
  </div>

  <div class="value">
    <span id="vel">0.00</span> mm/s
  </div>

  <div id="alarmBox" class="alarm">🚨 AUTO SHUTDOWN – EXCESSIVE VIBRATION</div>
</div>

<div class="panel">
  <h3>VIBRATION TREND</h3>
  <canvas id="trend" height="220"></canvas>

  <h3 style="margin-top:15px">🧾 ALARM HISTORY</h3>
  <table>
    <thead>
      <tr><th>Time</th><th>Type</th><th>Velocity</th><th>Description</th></tr>
    </thead>
    <tbody id="alarmTable"></tbody>
  </table>
</div>

</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
  databaseURL:"https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const auth = firebase.auth();
const db = firebase.database();

/* AUTH */
const loginBox = document.getElementById("loginBox");
const userEmailEl = document.getElementById("userEmail");
const loginError = document.getElementById("loginError");

function login(){
  auth.signInWithEmailAndPassword(
    email.value, password.value
  ).catch(e=>loginError.textContent=e.message);
}
function logout(){ auth.signOut(); }

auth.onAuthStateChanged(u=>{
  if(u){
    loginBox.style.display="none";
    userEmailEl.textContent=u.email;
  }else{
    loginBox.style.display="flex";
    userEmailEl.textContent="---";
  }
});

/* LIMITS */
const WARN = 90;
const TRIP = 100;
let lastState = "";

/* ELEMENTS */
const lampRun = lampWarn = lampTrip = null;
const lampRunEl = document.getElementById("lampRun");
const lampWarnEl = document.getElementById("lampWarn");
const lampTripEl = document.getElementById("lampTrip");
const belt = document.getElementById("belt");
const r1 = document.getElementById("r1");
const r2 = document.getElementById("r2");
const velEl = document.getElementById("vel");
const alarmBox = document.getElementById("alarmBox");

/* CHART */
const data = {labels:[],datasets:[{data:[],borderColor:"#22c55e",pointRadius:0}]};
const chart = new Chart(trend.getContext("2d"),{
  type:"line",
  data,
  options:{animation:false,scales:{x:{type:"time"},y:{min:0,max:120}}}
});

/* LOG */
function logAlarm(type,v,msg){
  db.ref("alarms").push({time:Date.now(),type,value:v,message:msg});
}

/* UPDATE */
function update(v){
  velEl.textContent=v.toFixed(2);
  data.labels.push(new Date());
  data.datasets[0].data.push(v);
  if(data.labels.length>300){data.labels.shift();data.datasets[0].data.shift();}
  chart.update("none");

  lampRunEl.className="lamp";
  lampWarnEl.className="lamp";
  lampTripEl.className="lamp";
  belt.className="belt idle";
  r1.className="roller";
  r2.className="roller";
  alarmBox.style.display="none";

  if(v<=10){
    lampRunEl.classList.add("green");
    if(lastState!=="IDLE"){logAlarm("IDLE",v,"Conveyor idle");lastState="IDLE";}
  }
  else if(v<WARN){
    lampRunEl.classList.add("green");
    belt.classList.add("run");
    r1.classList.add("rotate"); r2.classList.add("rotate");
    if(lastState!=="RUN"){logAlarm("RUN",v,"Conveyor running");lastState="RUN";}
  }
  else if(v<TRIP){
    lampWarnEl.classList.add("yellow");
    belt.classList.add("warn");
    r1.classList.add("rotate"); r2.classList.add("rotate");
    if(lastState!=="WARN"){logAlarm("WARN",v,"High vibration");lastState="WARN";}
  }
  else{
    lampTripEl.classList.add("red");
    belt.classList.add("trip");
    alarmBox.style.display="block";
    if(lastState!=="TRIP"){logAlarm("TRIP",v,"Auto shutdown");lastState="TRIP";}
  }
}

/* SENSOR */
db.ref("vibration/velocity_rms").on("value",s=>{
  if(typeof s.val()==="number") update(s.val());
});

/* HISTORY */
db.ref("alarms").limitToLast(50).on("child_added",snap=>{
  const a=snap.val();
  const tr=document.createElement("tr");
  tr.className=a.type==="TRIP"?"alarm-trip":a.type==="WARN"?"alarm-warn":"alarm-ok";
  tr.innerHTML=`<td>${new Date(a.time).toLocaleString()}</td>
                <td>${a.type}</td>
                <td>${a.value.toFixed(2)}</td>
                <td>${a.message}</td>`;
  alarmTable.prepend(tr);
});
</script>

</body>
</html>
