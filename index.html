<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Time Analyzer - DeurTech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body{
  margin:0;
  background:#1b1f23;
  color:#e5e7eb;
  font-family:Segoe UI, Arial, sans-serif;
}

/* HEADER */
.header{
  background:#0f172a;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #334155;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  padding:12px;
}

/* PANELS */
.panel{
  background:#111827;
  border:2px solid #334155;
  border-radius:6px;
  padding:10px;
}

/* STATUS LAMPS */
.lamps{
  display:flex;
  gap:14px;
  margin:10px 0;
}
.lamp{
  width:18px;height:18px;border-radius:50%;
  background:#374151;
  box-shadow:inset 0 0 6px black;
}
.green{background:#22c55e;}
.yellow{background:#facc15;}
.red{background:#dc2626;}

/* MIMIC */
.mimic{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  margin-top:20px;
}
.block{
  width:80px;height:80px;
  border:2px solid #64748b;
  display:flex;align-items:center;justify-content:center;
  background:#020617;
}
.motor{border-radius:50%;}
.bearing{width:60px;height:60px;border-radius:50%;}
.line{
  width:60px;height:6px;
  background:#22c55e;
}
.line.off{background:#7f1d1d;}

/* VALUE */
.value{
  font-size:30px;
  text-align:center;
  margin-top:10px;
}

/* ALARM */
.alarm{
  display:none;
  background:#7f1d1d;
  border:2px solid #dc2626;
  padding:10px;
  font-weight:bold;
  margin-top:10px;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.4;}}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border:1px solid #334155;
  padding:6px;
  text-align:center;
}
.alarm-warn{background:#713f12;color:#fde68a;}
.alarm-trip{background:#7f1d1d;color:#fecaca;}
.alarm-ok{background:#064e3b;color:#a7f3d0;}

canvas{
  background:#020617;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🏭 SCADA – Conveyor Vibration System</h2>
  <div>Operator: <b id="userEmail">---</b></div>
</div>

<div class="main">

<!-- PROCESS PANEL -->
<div class="panel">
  <h3>PROCESS MIMIC</h3>

  <div class="lamps">
    RUN <div id="lampRun" class="lamp"></div>
    WARN <div id="lampWarn" class="lamp"></div>
    TRIP <div id="lampTrip" class="lamp"></div>
  </div>

  <div class="mimic">
    <div class="block motor">MOTOR</div>
    <div id="l1" class="line"></div>
    <div class="block bearing">BRG1</div>
    <div id="l2" class="line"></div>
    <div class="block bearing">BRG2</div>
  </div>

  <div class="value">
    <span id="vel">0.00</span> mm/s
  </div>

  <div id="alarmBox" class="alarm">🚨 AUTO SHUTDOWN – ISO ZONE D</div>
</div>

<!-- TREND + HISTORY -->
<div class="panel">
  <h3>VIBRATION TREND</h3>
  <canvas id="trend" height="220"></canvas>

  <h3 style="margin-top:15px">🧾 ALARM & TRIP HISTORY</h3>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Velocity</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody id="alarmTable"></tbody>
  </table>
</div>

</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
  databaseURL:"https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = firebase.database();

/* LIMITS */
const WARN = 90;
const TRIP = 100;
let lastState = "NORMAL";

/* ELEMENTS */
const lampRun = document.getElementById("lampRun");
const lampWarn = document.getElementById("lampWarn");
const lampTrip = document.getElementById("lampTrip");
const alarmBox = document.getElementById("alarmBox");
const velEl = document.getElementById("vel");
const l1 = document.getElementById("l1");
const l2 = document.getElementById("l2");

/* CHART */
const data = {labels:[],datasets:[{data:[],borderColor:"#22c55e",pointRadius:0}]};
const chart = new Chart(trend.getContext("2d"),{
  type:"line",
  data,
  options:{animation:false,scales:{x:{type:"time"},y:{min:0,max:120}}}
});

/* LOG ALARM */
function logAlarm(type,v,msg){
  db.ref("alarms").push({
    time:Date.now(),
    type:type,
    value:v,
    message:msg
  });
}

/* UPDATE STATE MACHINE */
function update(v){
  velEl.textContent = v.toFixed(2);

  data.labels.push(new Date());
  data.datasets[0].data.push(v);
  chart.update("none");

  lampRun.className="lamp";
  lampWarn.className="lamp";
  lampTrip.className="lamp";
  alarmBox.style.display="none";
  l1.className="line";
  l2.className="line";

  if(v < WARN){
    lampRun.classList.add("green");
    if(lastState!=="NORMAL"){
      logAlarm("NORMAL",v,"Vibration returned to normal");
      lastState="NORMAL";
    }
  }
  else if(v < TRIP){
    lampWarn.classList.add("yellow");
    if(lastState!=="WARN"){
      logAlarm("WARN",v,"High vibration warning");
      lastState="WARN";
    }
  }
  else{
    lampTrip.classList.add("red");
    alarmBox.style.display="block";
    l1.classList.add("off");
    l2.classList.add("off");
    if(lastState!=="TRIP"){
      logAlarm("TRIP",v,"ISO ZONE D – Auto Shutdown");
      lastState="TRIP";
    }
  }
}

/* SENSOR LISTENER */
db.ref("vibration/velocity_rms").on("value",s=>{
  if(typeof s.val()==="number") update(s.val());
});

/* HISTORY TABLE */
const table = document.getElementById("alarmTable");
db.ref("alarms").limitToLast(50).on("child_added",snap=>{
  const a = snap.val();
  const tr = document.createElement("tr");
  tr.className = a.type==="TRIP"?"alarm-trip":a.type==="WARN"?"alarm-warn":"alarm-ok";
  tr.innerHTML = `
    <td>${new Date(a.time).toLocaleString()}</td>
    <td>${a.type}</td>
    <td>${a.value.toFixed(2)}</td>
    <td>${a.message}</td>
  `;
  table.prepend(tr);
});
</script>

</body>
</html>
