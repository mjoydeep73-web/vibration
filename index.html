<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Infinite Uptime – PlantOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#0f172a;color:#e5e7eb}

/* LOGIN */
#loginPage{
 position:fixed;inset:0;background:#ffffff;display:flex;align-items:center;justify-content:center
}
.loginBox{
 width:380px;padding:30px;border-radius:10px;background:#f8fafc;
 box-shadow:0 0 40px #0003;text-align:center
}
.loginBox h2{color:#0b2239}
.loginBox input{
 width:100%;padding:10px;margin:10px 0;border:1px solid #cbd5e1;border-radius:6px
}
.loginBox button{
 width:100%;padding:10px;background:#0284c7;color:#fff;border:none;border-radius:6px;font-size:16px
}

/* APP */
#app{display:none}
.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:230px;
 background:#0b2239;padding:20px
}
.sidebar h2{color:#fff;margin-bottom:30px}
.sidebar a{display:block;color:#94a3b8;margin:14px 0;cursor:pointer}
.sidebar a:hover{color:#fff}

.main{margin-left:250px;padding:20px}
.page{display:none}
.active{display:block}

.cards{display:flex;gap:20px;margin-bottom:20px}
.card{flex:1;background:#111827;padding:20px;border-radius:8px;text-align:center}

.lamp{width:18px;height:18px;border-radius:50%;display:inline-block;margin-left:6px;background:#374151}
.green{background:#22c55e}.yellow{background:#facc15}.red{background:#dc2626}.white{background:#e5e7eb}

.conveyor{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:30px}
.roller{width:70px;height:70px;background:#bbb;border-radius:50%}
.belt{
 width:320px;height:45px;border-radius:22px;
 background:repeating-linear-gradient(90deg,#8b9cae,#8b9cae 10px,#a1b1c4 10px,#a1b1c4 20px);
 background-size:40px 40px
}
@keyframes beltMove{from{background-position:0}to{background-position:40px}}
@keyframes rollerSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #334155;padding:6px;text-align:center;font-size:13px}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="loginBox">
    <h2>INFINITE UPTIME – PlantOS</h2>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="err" style="color:red;margin-top:10px"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <h2>INFINITE UPTIME</h2>
    <a onclick="showPage('analytics')">Analytics</a>
    <a onclick="showPage('history')">Service History</a>
    <a onclick="showPage('timeline')">Equipment Timeline</a>
    <a onclick="logout()">Logout</a>
  </div>

  <div class="main">

    <!-- ANALYTICS -->
    <div id="analytics" class="page active">
      <h2>Conveyor Analytics</h2>
      <div class="cards">
        <div class="card">Start<br><b id="startTime">--</b></div>
        <div class="card">Stop<br><b id="stopTime">--</b></div>
        <div class="card">Run Hours<br><b id="runHr">0</b></div>
        <div class="card">Last Alarm<br><b id="lastAlarm">--</b></div>
      </div>

      <div style="display:flex;justify-content:space-between">
        <div>
          RUN <div id="lampRun" class="lamp"></div><br><br>
          WARN <div id="lampWarn" class="lamp"></div><br><br>
          TRIP <div id="lampTrip" class="lamp"></div>
        </div>

        <div class="conveyor">
          <div id="rollerLeft" class="roller"></div>
          <div id="belt" class="belt"></div>
          <div id="rollerRight" class="roller"></div>
        </div>

        <div style="text-align:center">
          <h2 id="vel">0 mm/s</h2>
          <h2 id="rpmText">0 RPM</h2>
          <h2 id="stateText">IDLE</h2>
        </div>
      </div>
    </div>

    <!-- SERVICE HISTORY -->
    <div id="history" class="page">
      <h2>24 Hour Vibration Trend</h2>
      <canvas id="historyChart"></canvas>
    </div>

    <!-- TIMELINE -->
    <div id="timeline" class="page">
      <h2>Alarm Timeline</h2>
      <table>
        <thead><tr><th>Time</th><th>Type</th><th>Value</th><th>Message</th></tr></thead>
        <tbody id="alarmTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
 databaseURL:"https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db=firebase.database(),auth=firebase.auth();

function login(){
 auth.signInWithEmailAndPassword(email.value,pass.value)
 .catch(e=>err.textContent=e.message);
}
function logout(){auth.signOut()}
auth.onAuthStateChanged(u=>{
 loginPage.style.display=u?"none":"flex";
 app.style.display=u?"block":"none";
});

function showPage(p){
 document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
 document.getElementById(p).classList.add("active");
}

/* Conveyor + Chart logic */
const WARN=90,TRIP=100;
let startTs=null,runInt=null,lastState="";

const historyChart=new Chart(historyChart.getContext("2d"),{
 type:"line",
 data:{labels:[],datasets:[{label:"Velocity RMS (mm/s)",data:[],borderColor:"#22c55e",pointRadius:0}]},
 options:{scales:{x:{type:"time"},y:{min:0,max:400}}}
});

function animate(v){
 let dur=Math.max(0.25,1.2-1.2*(v/120));
 rollerLeft.style.animation=`rollerSpin ${dur}s linear infinite`;
 rollerRight.style.animation=`rollerSpin ${dur}s linear infinite reverse`;
 belt.style.animation=`beltMove ${dur}s linear infinite`;
 rpmText.textContent=Math.round(60/dur)+" RPM";
}
function stopAnim(){
 rollerLeft.style.animation="none";
 rollerRight.style.animation="none";
 belt.style.animation="none";
 rpmText.textContent="0 RPM";
}
function runHrUpd(){
 runHr.textContent=((Date.now()-startTs)/3600000).toFixed(2)+" Hr";
}

db.ref("vibration/velocity_rms").on("value",s=>{
 const v=s.val(); if(typeof v!=="number")return;
 vel.textContent=v.toFixed(2)+" mm/s";

 historyChart.data.labels.push(new Date());
 historyChart.data.datasets[0].data.push(v);
 if(historyChart.data.labels.length>500){
   historyChart.data.labels.shift();
   historyChart.data.datasets[0].data.shift();
 }
 historyChart.update();

 lampRun.className="lamp";lampWarn.className="lamp";lampTrip.className="lamp";

 if(v<=10){
  stateText.textContent="IDLE"; stopAnim(); lampRun.classList.add("white");
 }
 else if(v<WARN){
  stateText.textContent="RUN"; anim(v); lampRun.classList.add("green");
  if(lastState!=="RUN"){
    startTs=Date.now();
    startTime.textContent=new Date().toLocaleTimeString();
    runInt=setInterval(runHrUpd,1000);
    lastState="RUN";
  }
 }
 else if(v<TRIP){
  stateText.textContent="WARN"; stopAnim(); lampWarn.classList.add("yellow");
  clearInterval(runInt);
 }
 else{
  stateText.textContent="TRIP"; stopAnim(); lampTrip.classList.add("red");
  stopTime.textContent=new Date().toLocaleTimeString();
  clearInterval(runInt);
 }
});

db.ref("alarms").limitToLast(50).on("child_added",snap=>{
 const a=snap.val();
 const tr=document.createElement("tr");
 tr.innerHTML=`<td>${new Date(a.time).toLocaleString()}</td>
 <td>${a.type}</td><td>${a.value.toFixed(2)}</td><td>${a.message}</td>`;
 alarmTable.prepend(tr);
});
</script>
</body>
</html>
