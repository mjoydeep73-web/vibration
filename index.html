<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>PlantOS Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* LOGIN */
        #loginBox {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #loginBox .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 8px;
            color: white;
            text-align: center;
            width: 320px;
        }

        /* DASHBOARD */
        .dashboard-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: #1e293b;
            color: white;
            padding: 20px;
        }

        .sidebar-header h3 {
            margin-bottom: 20px;
        }

        .sidebar-nav {
            list-style-type: none;
        }

        .sidebar-nav li {
            margin: 10px 0;
        }

        .sidebar-nav li a {
            color: #e5e7eb;
            text-decoration: none;
        }

        .sidebar-nav li a.active {
            font-weight: bold;
            color: #22c55e;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f8fafc;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .welcome {
            font-size: 18px;
            font-weight: bold;
        }

        .select-plants select {
            padding: 10px;
            font-size: 16px;
        }

        /* Analytics Metrics */
        .analytics {
            margin-bottom: 30px;
        }

        .analytics h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .analytics-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .metric {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .metric span {
            display: block;
            font-size: 16px;
            color: #555;
        }

        .metric strong {
            font-size: 22px;
            font-weight: bold;
            color: #1f2937;
        }

        /* Conveyor and Trend */
        .process-section {
            margin-bottom: 30px;
        }

        /* Alarm History */
        .alarm-history table {
            width: 100%;
            border-collapse: collapse;
        }

        .alarm-history th,
        .alarm-history td {
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        .alarm-trip {
            background-color: #f9d8d8;
        }

        .alarm-warn {
            background-color: #fff4b3;
        }

        .alarm-ok {
            background-color: #d1f7d3;
        }

        /* Conveyor Animation */
        .conveyor-loop {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .roller {
            width: 60px;
            height: 60px;
            background: #bbb;
            border-radius: 50%;
        }

        .belt {
            width: 300px;
            height: 40px;
            border-radius: 20px;
            background: repeating-linear-gradient(90deg, #8b9cae, #8b9cae 10px, #a1b1c4 10px, #a1b1c4 20px);
            background-size: 40px 40px;
        }

        @keyframes beltMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 40px 0;
            }
        }

        @keyframes rollerSpin {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
    <div class="box">
        <h3>🔐 Operator Login</h3>
        <input id="email" type="email" placeholder="Email" style="width:100%;padding:8px;margin:6px 0">
        <input id="password" type="password" placeholder="Password" style="width:100%;padding:8px;margin:6px 0">
        <button onclick="login()" style="width:100%;padding:8px">Login</button>
        <div id="loginError" style="color:#f87171"></div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard-container" style="display:none;">
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>INFINITE UPTIME</h3>
        </div>
        <ul class="sidebar-nav">
            <li><a href="#" class="active">Analytics</a></li>
            <li><a href="#">Service History</a></li>
            <li><a href="#">Equipment Timeline</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="welcome">
                <span>Welcome, <strong id="userName"></strong></span>
            </div>
            <div class="select-plants">
                <select>
                    <option>All Plants</option>
                    <option>Plant 1</option>
                    <option>Plant 2</option>
                </select>
            </div>
        </div>

        <div class="analytics">
            <h2>Analytics</h2>
            <div class="analytics-metrics">
                <div class="metric">
                    <span>MTTR</span>
                    <strong>1196 Hours</strong>
                </div>
                <div class="metric">
                    <span>MTBF</span>
                    <strong>0 Hours</strong>
                </div>
                <div class="metric">
                    <span>Plants</span>
                    <strong>1</strong>
                </div>
                <div class="metric">
                    <span>Areas</span>
                    <strong>1</strong>
                </div>
                <div class="metric">
                    <span>Equipment</span>
                    <strong>8</strong>
                </div>
            </div>
        </div>

        <div class="process-section">
            <h3>Conveyor Animation</h3>
            <div class="conveyor-loop">
                <div id="rollerLeft" class="roller"></div>
                <div id="belt" class="belt"></div>
                <div id="rollerRight" class="roller"></div>
            </div>
            <div class="vibration-trend">
                <h3>Vibration Trend</h3>
                <canvas id="trend" height="120"></canvas>
            </div>
        </div>

        <div class="alarm-history">
            <h3>Alarm History</h3>
            <table width="100%" border="1" style="border-collapse:collapse;font-size:12px">
                <thead><tr><th>Time</th><th>Type</th><th>Value</th><th>Msg</th></tr></thead>
                <tbody id="alarmTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Firebase setup and initialization
    firebase.initializeApp({
        apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
        databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database(), auth = firebase.auth();

    function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        auth.signInWithEmailAndPassword(email, password).catch(e => {
            document.getElementById("loginError").textContent = e.message;
        });
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            // Show dashboard and hide login page
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("dashboard").style.display = "flex";
            document.getElementById("userName").textContent = user.displayName || user.email;
        } else {
            // Show login page and hide dashboard
            document.getElementById("loginBox").style.display = "flex";
            document.getElementById("dashboard").style.display = "none";
        }
    });

    // Chart.js configuration for the vibration trend
    const chart = new Chart(document.getElementById('trend').getContext('2d'), {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                data: [],
                borderColor: "#22c55e",
                pointRadius: 0
            }]
        },
        options: {
            animation: false,
            scales: {
                x: { type: 'time' },
                y: { min: 0, max: 400 }
            }
        }
    });

    function updateVibration(v) {
        const vel = document.getElementById('vel');
        vel.textContent = v.toFixed(2) + " mm/s";

        chart.data.labels.push(new Date());
        chart.data.datasets[0].data.push(v);
        if (chart.data.labels.length > 300) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }
        chart.update("none");

        let speed = Math.min(v / 120, 1);
        let duration = Math.max(0.25, 1.2 - 1.2 * speed);
        let rpm = Math.round(60 / duration);
        document.getElementById('rpmText').textContent = rpm;

        document.getElementById('rollerLeft').style.animation = `rollerSpin ${duration}s linear infinite`;
        document.getElementById('rollerRight').style.animation = `rollerSpin ${duration}s linear infinite reverse`;
        document.getElementById('belt').style.animation = `beltMove ${duration}s linear infinite`;

        let stateText = document.getElementById('stateText');
        if (v <= 10) {
            stateText.textContent = "IDLE";
            rpm = 0;
            document.getElementById('rollerLeft').style.animation = "none";
            document.getElementById('rollerRight').style.animation = "none";
            document.getElementById('belt').style.animation = "none";
        } else {
            stateText.textContent = "RUN";
        }
    }

    db.ref("vibration/velocity_rms").on("value", snapshot => {
        const val = snapshot.val();
        if (typeof val === "number") updateVibration(val);
    });

    // Fetch and display alarm history
    db.ref("alarms").limitToLast(10).on("child_added", snapshot => {
        const alarm = snapshot.val();
        const tr = document.createElement("tr");
        tr.className = alarm.type === "TRIP" ? "alarm-trip" : alarm.type === "WARN" ? "alarm-warn" : "alarm-ok";
        tr.innerHTML = `<td>${new Date(alarm.time).toLocaleString()}</td><td>${alarm.type}</td><td>${alarm.value.toFixed(2)}</td><td>${alarm.message}</td>`;
        document.getElementById("alarmTable").prepend(tr);
    });
</script>

</body>
</html>
