<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Velocity RMS Monitoring</title>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Velocity RMS (mm/s) – ISO 10816</h2>
<canvas id="chart"></canvas>

<script>
// 🔥 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
    databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ctx = document.getElementById('chart');

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: 'Velocity RMS (mm/s)',
      data: [],
      borderWidth: 2,
      fill: false
    }]
  },
  options: {
    scales: {
      y: {
        min: 0,
        max: 10,
        grid: { color: '#ccc' }
      }
    },
    plugins: {
      annotation: {
        annotations: {
          green: { type: 'box', yMin: 0, yMax: 2.8, backgroundColor: 'rgba(0,255,0,0.1)' },
          yellow:{ type: 'box', yMin: 2.8, yMax: 4.5, backgroundColor: 'rgba(255,255,0,0.1)' },
          orange:{ type: 'box', yMin: 4.5, yMax: 7.1, backgroundColor: 'rgba(255,165,0,0.1)' },
          red:   { type: 'box', yMin: 7.1, yMax: 10, backgroundColor: 'rgba(255,0,0,0.1)' }
        }
      }
    }
  }
});

db.ref("/vibration").on("value", snap => {
  const d = snap.val();
  if (!d) return;

  const t = new Date(d.timestamp * 1000);
  chart.data.labels.push(t);
  chart.data.datasets[0].data.push(d.velocity_rms);

  if (chart.data.labels.length > 60) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }
  chart.update();
});
</script>

</body>
</html>
