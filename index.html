<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinite Uptime Dashboard</title>

  <!-- Firebase & Chart.js Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

  <!-- Styles -->
  <style>
    body {
      margin: 0;
      font-family: Segoe UI;
      background: #0f172a;
      color: #e5e7eb;
    }
    #loginPage {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loginBox {
      width: 360px;
      padding: 30px;
      border-radius: 10px;
      background: #f8fafc;
      box-shadow: 0 0 30px #0003;
      text-align: center;
    }
    .loginBox input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .loginBox button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    #app {
      display: none;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: #0b2239;
      padding: 20px;
    }
    .sidebar h2 {
      color: #fff;
      margin-bottom: 30px;
    }
    .sidebar a {
      display: block;
      color: #94a3b8;
      margin: 14px 0;
      cursor: pointer;
    }
    .sidebar a:hover {
      color: #fff;
    }
    .main {
      margin-left: 250px;
      padding: 20px;
    }
    .page {
      display: none;
    }
    .active {
      display: block;
    }
    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      flex: 1;
      background: #111827;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .lamp {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 6px;
      background: #374151;
    }
    .green {
      background: #22c55e;
    }
    .yellow {
      background: #facc15;
    }
    .red {
      background: #dc2626;
    }
    .white {
      background: #e5e7eb;
    }
    .conveyor {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }
    .roller {
      width: 70px;
      height: 70px;
      background: #bbb;
      border-radius: 50%;
    }
    .belt {
      width: 320px;
      height: 45px;
      border-radius: 22px;
      background: repeating-linear-gradient(90deg, #8b9cae, #8b9cae 10px, #a1b1c4 10px, #a1b1c4 20px);
      background-size: 40px 40px;
    }
    @keyframes beltMove {
      from {
        background-position: 0;
      }
      to {
        background-position: 40px;
      }
    }
    @keyframes rollerSpin {
      from {
        transform: rotate(0);
      }
      to {
        transform: rotate(360deg);
      }
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 6px;
      text-align: center;
      font-size: 13px;
    }
    .alarm-trip {
      background-color: #dc2626;
      color: white;
    }
    .alarm-warn {
      background-color: #facc15;
      color: black;
    }
    .alarm-ok {
      background-color: #22c55e;
      color: white;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="loginBox">
    <h2>INFINITE UPTIME – PlantOS</h2>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="err" style="color:red;margin-top:10px"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <h2>INFINITE UPTIME</h2>
    <a onclick="showPage('analytics')">Analytics</a>
    <a onclick="showPage('history')">Service History</a>
    <a onclick="showPage('timeline')">Equipment Timeline</a>
    <a onclick="logout()">Logout</a>
  </div>

  <div class="main">
    <!-- ANALYTICS -->
    <div id="analytics" class="page active">
      <h2>Conveyor Analytics</h2>

      <div class="cards">
        <div class="card">RUN <div id="lampRun" class="lamp"></div></div>
        <div class="card">WARN <div id="lampWarn" class="lamp"></div></div>
        <div class="card">TRIP <div id="lampTrip" class="lamp"></div></div>
      </div>

      <div class="conveyor">
        <div id="rollerLeft" class="roller"></div>
        <div id="belt" class="belt"></div>
        <div id="rollerRight" class="roller"></div>
      </div>

      <div style="text-align:center;margin-top:20px">
        <h2 id="vel">0 mm/s</h2>
        <h2 id="rpmText">0 RPM</h2>
        <h2 id="stateText">IDLE</h2>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="history" class="page">
      <h2>Vibration Trend</h2>
      <canvas id="historyChart"></canvas>
    </div>

    <!-- TIMELINE -->
    <div id="timeline" class="page">
      <h2>Alarm Timeline</h2>
      <table>
        <thead>
          <tr><th>Time</th><th>Type</th><th>Value</th><th>Message</th></tr>
        </thead>
        <tbody id="alarmTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAcb0R8GyyLdSoo3R3jyXtSI6oqy7N-51E",
    databaseURL: "https://vibrationstatus-default-rtdb.asia-southeast1.firebasedatabase.app/"
  });
  const db = firebase.database(), auth = firebase.auth();

  const vel = document.getElementById("vel");
  const rpmText = document.getElementById("rpmText");
  const stateText = document.getElementById("stateText");
  const belt = document.getElementById("belt");
  const rollerLeft = document.getElementById("rollerLeft");
  const rollerRight = document.getElementById("rollerRight");
  const lampRun = document.getElementById("lampRun");
  const lampWarn = document.getElementById("lampWarn");
  const lampTrip = document.getElementById("lampTrip");
  const alarmTable = document.getElementById("alarmTable"); // Alarm table reference

  // Function to stop the animation
  function stopAnim() {
    belt.style.animation = "none";
    rollerLeft.style.animation = "none";
    rollerRight.style.animation = "none";
  }

  // Function to animate the conveyor based on velocity
  function animate(v) {
    let d = 1.2 - (Math.min(Math.max(v, 10), 120) / 150);
    belt.style.animation = `beltMove ${d}s linear infinite`;
    rollerLeft.style.animation = `rollerSpin ${d}s linear infinite`;
    rollerRight.style.animation = `rollerSpin ${d}s linear infinite`;
  }

  // History chart setup (for vibration RMS over time)
  const historyChart = new Chart(document.getElementById("historyChart"), {
    type: "line",
    data: { labels: [], datasets: [{ label: "Velocity RMS", data: [], borderWidth: 2 }] },
    options: { scales: { x: { type: "time" } } }
  });

  // Fetch and display velocity data from Firebase
  db.ref("vibration/velocity_rms").on("value", s => {
    const v = s.val();
    if (typeof v !== "number") return;

    vel.textContent = v.toFixed(2) + " mm/s";
    rpmText.textContent = Math.round(v * 2) + " RPM";

    // Update history chart
    historyChart.data.labels.push(new Date());
    historyChart.data.datasets[0].data.push(v);
    if (historyChart.data.labels.length > 300) {
      historyChart.data.labels.shift();
      historyChart.data.datasets[0].data.shift();
    }
    historyChart.update();

    // Lamp and conveyor state updates
    lampRun.className = "lamp";
    lampWarn.className = "lamp";
    lampTrip.className = "lamp";

    if (v <= 10) {
      stateText.textContent = "IDLE";
      stopAnim();
      lampRun.classList.add("white");
    }
    else if (v < 90) {
      stateText.textContent = "RUN";
      animate(v);
      lampRun.classList.add("green");
    }
    else if (v < 100) {
      stateText.textContent = "WARN";
      stopAnim();
      lampWarn.classList.add("yellow");
    }
    else {
      stateText.textContent = "TRIP";
      stopAnim();
      lampTrip.classList.add("red");
    }
  });

  // Fetch the last 10 alarm entries and display them
  db.ref("alarms").limitToLast(10).on("child_added", snap => {
    const a = snap.val();
    const tr = document.createElement("tr");

    // Set the row's class based on the alarm type
    tr.className = a.type === "TRIP" ? "alarm-trip" :
                   a.type === "WARN" ? "alarm-warn" : "alarm-ok";

    // Populate the table row with alarm data
    tr.innerHTML = `
      <td>${new Date(a.time).toLocaleString()}</td>
      <td>${a.type}</td>
      <td>${a.value.toFixed(2)}</td>
      <td>${a.message}</td>
    `;

    // Prepend the new row to the table
    alarmTable.prepend(tr);
  });

  // Login and Logout functionality
  function login() {
    auth.signInWithEmailAndPassword(email.value, pass.value)
      .catch(e => err.textContent = e.message);
  }

  function logout() {
    auth.signOut();
  }

  // Check user authentication state
  auth.onAuthStateChanged(u => {
    loginPage.style.display = u ? "none" : "flex";
    app.style.display = u ? "block" : "none";
  });

  // Show the appropriate page (Analytics, History, or Timeline)
  function showPage(p) {
    document.querySelectorAll(".page").forEach(e => e.classList.remove("active"));
    document.getElementById(p).classList.add("active");
  }
</script>

</body>
</html>
